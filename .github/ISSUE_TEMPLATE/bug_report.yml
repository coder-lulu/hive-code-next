name: Bug report
description: Report a problem with HiveCode
title: '[Bug]: '
type: Bug
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for HiveCode bugs. Include enough detail for someone else to reproduce the issue.

        Please write your issue in English.

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: hivecode_version
    attributes:
      label: HiveCode version
      description: Include the exact HiveCode version if you can. You can find it in `HiveCode > About HiveCode`.
      placeholder: v1.4.178-rc.2
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the bug in your own words. Include a short summary, reproduction steps, and anything else that seems relevant.
      placeholder: |
        Short summary:
        HiveCode crashes when ...

        What happened?

        How can we reproduce it?
        1. ...
        2. ...
        3. ...

        Anything else that might help:
    validations:
      required: true
