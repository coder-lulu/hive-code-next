name: HiveCode Windows x64 hardware-signed package

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_version:
        required: true
        type: string
      release_channel:
        required: true
        type: string
      release_build_number:
        required: true
        type: string
      release_id:
        required: true
        type: string
      batch_id:
        required: true
        type: string
      runtime_run_id:
        required: true
        type: string
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Exact package version to publish, e.g. 1.5.0-beta.1'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: hivecode-windows-hardware-sign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-runtime:
    if: inputs.batch_id == '' && github.repository == 'coder-lulu/hive-code-next' && (startsWith(github.ref, 'refs/tags/v') || github.ref_protected == true)
    uses: ./.github/workflows/node-server-tests.yml
    with:
      ref: ${{ inputs.source_sha || github.sha }}
      build_template: true

  build-and-sign:
    needs: [desktop-runtime]
    name: Build and hardware-sign HiveCode Windows x64
    if: ${{ (inputs.batch_id == '' || inputs.source_sha == github.sha) && !cancelled() && github.repository == 'coder-lulu/hive-code-next' && (startsWith(github.ref, 'refs/tags/v') || github.ref_protected == true) && (needs.desktop-runtime.result == 'success' || (inputs.batch_id != '' && needs.desktop-runtime.result == 'skipped')) }}
    permissions:
      id-token: write
      actions: read
      contents: read
    runs-on: [self-hosted, windows, x64]
    environment: ${{ inputs.batch_id != '' && 'release-production' || 'hivecode-windows-signing' }}
    timeout-minutes: 120
    env:
      ORCA_REQUIRE_ORCAD_TEMPLATE: '1'
      HIVECODE_WINDOWS_SIGNING_EXECUTABLE: ${{ vars.HIVECODE_WINDOWS_SIGNING_EXECUTABLE }}
      HIVECODE_WINDOWS_SIGNING_ARGUMENTS: ${{ vars.HIVECODE_WINDOWS_SIGNING_ARGUMENTS }}
      HIVECODE_WINDOWS_SIGNING_TIMEOUT_MS: ${{ vars.HIVECODE_WINDOWS_SIGNING_TIMEOUT_MS }}
      HIVECODE_WINDOWS_EXPECTED_SIGNERS: ${{ vars.HIVECODE_WINDOWS_EXPECTED_SIGNERS }}
      HIVECODE_WINDOWS_EXPECTED_THUMBPRINTS: ${{ vars.HIVECODE_WINDOWS_EXPECTED_THUMBPRINTS }}
      HIVECODE_WINDOWS_POWERSHELL_EXECUTABLE: ${{ vars.HIVECODE_WINDOWS_POWERSHELL_EXECUTABLE }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Stage the qualified headless runtime template
        uses: actions/download-artifact@v8
        with:
          name: orcad-template
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: out/orcad-template

      - name: Stage the qualified Windows process-tree addons
        uses: actions/download-artifact@v8
        with:
          name: orcad-windows-process-tree
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: .build/windows-process-tree

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Resolve identity and reserve Windows build number
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          REQUESTED_CHANNEL: ${{ inputs.release_channel }}
          RESERVED_BUILD_NUMBER: ${{ inputs.release_build_number }}
          BATCH_ID: ${{ inputs.batch_id }}
        run: |
          $version = if (-not [string]::IsNullOrWhiteSpace($env:REQUESTED_VERSION)) {
            $env:REQUESTED_VERSION.Trim().TrimStart('v')
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $packageVersion) {
            throw "Release version $version does not match package.json version $packageVersion"
          }
          if ($version -match '^\d+\.\d+\.\d+-beta\.\d+$') {
            $channel = 'beta'
          } elseif ($version -match '^\d+\.\d+\.\d+$') {
            $channel = 'stable'
          } else {
            throw "Unsupported HiveCode release version: $version"
          }
          if ($env:BATCH_ID) {
            if ($channel -ne $env:REQUESTED_CHANNEL -or $env:RESERVED_BUILD_NUMBER -notmatch '^[1-9][0-9]*$') { throw 'Invalid reserved batch identity' }
            "HIVECODE_BUILD_NUMBER=$env:RESERVED_BUILD_NUMBER" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            $buildNumber = (Get-Content config/client-build.json -Raw | ConvertFrom-Json).desktopBuildNumber
            if ($buildNumber -lt 1) { throw 'Invalid committed desktopBuildNumber' }
            "HIVECODE_BUILD_NUMBER=$buildNumber" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          "HIVECODE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HIVECODE_RELEASE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HIVECODE_COMMIT_SHA=${{ inputs.source_sha || github.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HIVECODE_EMBED_RELEASE_IDENTITY=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Preflight protected hardware signing boundary
        shell: pwsh
        run: node config/scripts/build-windows-x64-hardware-signed.mjs --preflight-only

      - name: Install locked dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build and sign HiveCode Windows x64
        shell: pwsh
        run: pnpm run build:win:x64:hardware-signed

      - name: Verify final signed installer
        shell: pwsh
        run: |
          $artifact = 'dist/hivecode-windows-setup.exe'
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            throw "Signed HiveCode installer was not produced: $artifact"
          }
          pnpm run verify:windows:hardware -- $artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $signature = Get-AuthenticodeSignature -LiteralPath $artifact
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw 'The final Windows installer does not have a valid Authenticode signature'
          }
          $fingerprint = $signature.SignerCertificate.GetCertHashString(
            [System.Security.Cryptography.HashAlgorithmName]::SHA256
          )
          "HIVECODE_SIGNING_CERTIFICATE_FINGERPRINT=$fingerprint" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish verified Windows installer to HiveCloud object storage
        if: inputs.batch_id != ''
        shell: pwsh
        env:
          HIVECLOUD_API_URL: ${{ vars.HIVECLOUD_API_URL }}
          HIVECLOUD_RELEASE_SCOPE: ${{ inputs.batch_id != '' && 'artifact' || '' }}
          HIVECLOUD_API_CLIENT_ID: ${{ vars.HIVECLOUD_API_CLIENT_ID }}
          HIVECODE_COMMIT_SHA: ${{ inputs.source_sha || github.sha }}
          HIVECLOUD_RELEASE_ID: ${{ inputs.release_id }}
          HIVECLOUD_RELEASE_BATCH_ID: ${{ inputs.batch_id }}
          HIVECODE_PUBLISH: ${{ inputs.batch_id != '' && 'false' || 'true' }}
          HIVECLOUD_RELEASE_ATTESTATION_KEY: ${{ secrets.HIVECLOUD_RELEASE_ATTESTATION_KEY }}
          HIVECODE_DESKTOP_PLATFORM: windows
          HIVECODE_DESKTOP_ARCHITECTURE: x64
          HIVECODE_ARTIFACT_PATHS: x64=dist/hivecode-windows-setup.exe
          HIVECODE_RELEASE_NOTES: ${{ github.ref_name }}
        run: node config/scripts/publish-hivecloud-desktop-release.mjs

      - name: Upload verified HiveCode Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hivecode-windows-x64-${{ inputs.source_sha || github.sha }}
          path: |
            dist/hivecode-windows-setup.exe
            dist/hivecode-windows-setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
