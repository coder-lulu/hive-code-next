name: Upstream Sync

# This workflow is the only automated path that merges upstream into the fork.
# Conflicts stop the run before anything is pushed, so they remain reviewable on
# vendor-integration instead of leaking into the product branch.
on:
  schedule:
    - cron: '17 2 * * 1,4'
  workflow_dispatch:
    inputs:
      target_branch:
        description: Product branch that receives the reviewed vendor PR
        required: true
        type: string
        default: hivecode/main-next

concurrency:
  group: hivecode-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: stablyai/orca
  UPSTREAM_BRANCH: main
  VENDOR_BRANCH: vendor-integration
  TARGET_BRANCH: ${{ inputs.target_branch || 'hivecode/main-next' }}

jobs:
  sync:
    name: merge upstream into vendor-integration
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
      target_sha: ${{ steps.sync.outputs.target_sha }}
      vendor_sha: ${{ steps.sync.outputs.vendor_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Integrate product branch and upstream on vendor-integration
        id: sync
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/${{ env.UPSTREAM_REPOSITORY }}.git
        run: |
          set -euo pipefail

          if ! git check-ref-format --branch "$VENDOR_BRANCH"; then
            echo "::error::Invalid vendor branch name: $VENDOR_BRANCH"
            exit 1
          fi
          case "$TARGET_BRANCH" in
            main|hivecode/main-next) ;;
            *)
              echo "::error::Target branch must be main or hivecode/main-next: $TARGET_BRANCH"
              exit 1
              ;;
          esac
          if ! git check-ref-format --branch "$TARGET_BRANCH"; then
            echo "::error::Invalid target branch name: $TARGET_BRANCH"
            exit 1
          fi

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "$UPSTREAM_URL"
          else
            git remote add upstream "$UPSTREAM_URL"
          fi
          git fetch --no-tags --prune upstream "$UPSTREAM_BRANCH"
          upstream_sha="$(git rev-parse "upstream/$UPSTREAM_BRANCH")"

          target_ref="refs/remotes/origin/$TARGET_BRANCH"
          if ! git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:$target_ref"; then
            echo "::error::Target branch is not published on origin: $TARGET_BRANCH"
            exit 1
          fi
          target_sha="$(git rev-parse "$target_ref")"

          vendor_ref="refs/remotes/origin/$VENDOR_BRANCH"
          if ! git fetch --no-tags origin "refs/heads/$VENDOR_BRANCH:$vendor_ref"; then
            echo '::error::vendor-integration is not published on origin.'
            echo 'Bootstrap it from the validated local vendor-integration branch before enabling this workflow.'
            echo 'Refusing to create it from upstream/main because that would discard the product overlay.'
            exit 1
          fi
          vendor_base="$vendor_ref"
          vendor_base_sha="$(git rev-parse "$vendor_base")"

          git switch --force-create "$VENDOR_BRANCH" "$vendor_base"
          if ! git merge --no-edit "$target_ref"; then
            git diff --name-only --diff-filter=U | sort -u > "$RUNNER_TEMP/product-conflicts.txt"
            echo '::error::Product integration conflicts must be resolved on vendor-integration.'
            cat "$RUNNER_TEMP/product-conflicts.txt"
            git merge --abort || true
            exit 1
          fi
          if ! git merge --no-edit --no-ff "upstream/$UPSTREAM_BRANCH"; then
            git diff --name-only --diff-filter=U | sort -u > "$RUNNER_TEMP/upstream-conflicts.txt"
            echo '::error::Upstream merge conflicts must be resolved on vendor-integration.'
            cat "$RUNNER_TEMP/upstream-conflicts.txt"
            git merge --abort || true
            exit 1
          fi

          git push \
            --force-with-lease="refs/heads/$VENDOR_BRANCH:$vendor_base_sha" \
            origin "HEAD:refs/heads/$VENDOR_BRANCH"
          vendor_sha="$(git rev-parse HEAD)"
          {
            echo "upstream_sha=$upstream_sha"
            echo "target_sha=$target_sha"
            echo "vendor_sha=$vendor_sha"
          } >> "$GITHUB_OUTPUT"

          {
            echo '## Upstream sync evidence'
            printf '%s\n' "- Upstream: $upstream_sha"
            printf '%s\n' "- Product target: $TARGET_BRANCH at $target_sha"
            printf '%s\n' "- vendor-integration: $vendor_sha"
            printf '%s\n' "- Target PR branch: $TARGET_BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merge and delta evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-sync-evidence
          path: |
            ${{ runner.temp }}/product-conflicts.txt
            ${{ runner.temp }}/upstream-conflicts.txt
          if-no-files-found: ignore
          retention-days: 30

  gates:
    name: compatibility gates
    needs: sync
    if: needs.sync.result == 'success'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vendor-integration
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.vendor_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tested vendor commit
        env:
          VENDOR_SHA: ${{ needs.sync.outputs.vendor_sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$VENDOR_SHA"

      - name: Fetch upstream comparison base
        shell: bash
        run: |
          set -euo pipefail
          upstream_url="https://github.com/${UPSTREAM_REPOSITORY}.git"
          git remote add upstream "$upstream_url"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

      - name: Generate fork delta evidence
        shell: bash
        run: |
          set -euo pipefail
          node config/scripts/audit-fork-delta.mjs \
            --base "upstream/$UPSTREAM_BRANCH" \
            --head HEAD \
            --output "$RUNNER_TEMP/fork-delta.md" > "$RUNNER_TEMP/fork-delta.stdout"

      - uses: ./.github/actions/install-node-dependencies

      - name: Verify generated product configuration
        run: pnpm run verify:product-config

      - name: Enforce fork boundary
        run: pnpm run check:brand-boundary

      - name: Run product and compatibility tests
        run: |
          pnpm exec vitest run --config config/vitest.config.ts \
            config/scripts/audit-fork-delta.test.mjs \
            config/scripts/check-hivecode-brand-boundary.test.mjs \
            config/scripts/generate-product-config.test.mjs \
            config/scripts/product-identity-integration.test.mjs \
            config/scripts/product-release-workflow-boundary.test.mjs \
            config/scripts/packaged-updater-security-boundary.test.mjs \
            src/shared/pairing.test.ts \
            src/shared/product-update-policy.test.ts \
            src/shared/product-update-source.test.ts \
            src/main/updater-prerelease-feed.test.ts \
            src/main/updater-release-builds.test.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Desktop build
        run: pnpm run build:desktop

      - name: Web build
        run: pnpm run build:web

      - name: Mobile typecheck, lint, and tests
        run: |
          pnpm --dir mobile run typecheck
          pnpm --dir mobile run lint
          pnpm --dir mobile run test

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-sync-compatibility-evidence
          path: |
            ${{ runner.temp }}/fork-delta.md
            ${{ runner.temp }}/fork-delta.stdout
          if-no-files-found: ignore
          retention-days: 30

  propose:
    name: propose reviewed vendor update
    needs:
      - sync
      - gates
    if: needs.gates.result == 'success'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Open or update vendor PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
          TARGET_SHA: ${{ needs.sync.outputs.target_sha }}
          VENDOR_SHA: ${{ needs.sync.outputs.vendor_sha }}
        shell: bash
        run: |
          set -euo pipefail
          vendor_remote_sha="$(git ls-remote origin "refs/heads/$VENDOR_BRANCH" | cut -f1)"
          if [[ -z "$vendor_remote_sha" || "$vendor_remote_sha" != "$VENDOR_SHA" ]]; then
            echo "::error::vendor-integration moved after gates; expected $VENDOR_SHA, found ${vendor_remote_sha:-missing}."
            exit 1
          fi
          target_remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          if [[ -z "$target_remote_sha" || "$target_remote_sha" != "$TARGET_SHA" ]]; then
            echo "::error::$TARGET_BRANCH moved after gates; expected $TARGET_SHA, found ${target_remote_sha:-missing}."
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/heads/$VENDOR_BRANCH:refs/remotes/origin/$VENDOR_BRANCH" \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          if git diff --quiet "origin/$TARGET_BRANCH...origin/$VENDOR_BRANCH"; then
            echo "vendor-integration has no changes relative to $TARGET_BRANCH."
            exit 0
          fi

          cat > "$RUNNER_TEMP/upstream-sync-pr.md" <<EOF
          ## Upstream sync

          This PR was produced by the controlled fork sync workflow.

          - Upstream SHA: $UPSTREAM_SHA
          - Product target SHA: $TARGET_SHA
          - vendor-integration SHA: $VENDOR_SHA
          - Compatibility gates: passed
          - Merge conflicts: none

          The workflow never merges directly into $TARGET_BRANCH; review is required before the product branch advances.
          EOF

          if gh pr list --head "$VENDOR_BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$VENDOR_BRANCH" \
              --title "chore: sync upstream into vendor-integration" \
              --body-file "$RUNNER_TEMP/upstream-sync-pr.md"
          else
            echo "An open vendor sync PR already exists; its branch has been updated."
          fi
