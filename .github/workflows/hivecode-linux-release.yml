name: HiveCode Linux release

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_version:
        required: true
        type: string
      release_channel:
        required: true
        type: string
      release_build_number:
        required: true
        type: string
      release_id:
        required: true
        type: string
      batch_id:
        required: true
        type: string
      runtime_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Exact package version to build, e.g. 1.5.0-beta.1'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: hivecode-linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reserve:
    if: (inputs.batch_id == '' || inputs.source_sha == github.sha) && github.repository == 'coder-lulu/hive-code-next'
    environment: release-production
    permissions:
      id-token: write
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      channel: ${{ steps.identity.outputs.channel }}
      build_number: ${{ steps.identity.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Validate release identity
        id: identity
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          REQUESTED_CHANNEL: ${{ inputs.release_channel }}
          RESERVED_BUILD_NUMBER: ${{ inputs.release_build_number }}
          BATCH_ID: ${{ inputs.batch_id }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          package_version="$(node -p "require('./package.json').version")"
          test "$version" = "$package_version"
          build_number="$(node -e "const n = require('./config/client-build.json').desktopBuildNumber; if (!Number.isSafeInteger(n) || n < 1) process.exit(1); console.log(n)")"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            channel=beta
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel=stable
          else
            echo "::error::Unsupported HiveCode release version: $version"
            exit 1
          fi
          if [[ -n "$BATCH_ID" ]]; then
            test "$channel" = "$REQUESTED_CHANNEL"
            [[ "$RESERVED_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
            build_number="$RESERVED_BUILD_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

  desktop-runtime:
    if: inputs.batch_id == ''
    needs: reserve
    uses: ./.github/workflows/node-server-tests.yml
    with:
      ref: ${{ inputs.source_sha || github.sha }}
      build_template: true

  build:
    if: ${{ !cancelled() && needs.reserve.result == 'success' && (needs.desktop-runtime.result == 'success' || (inputs.batch_id != '' && needs.desktop-runtime.result == 'skipped')) }}
    needs: [reserve, desktop-runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-22.04
            builder_arch: x64
            unpacked_dir: dist/linux-unpacked
          - architecture: arm64
            runner: ubuntu-24.04-arm
            builder_arch: arm64
            unpacked_dir: dist/linux-arm64-unpacked
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      HIVECODE_BUILD_NUMBER: ${{ needs.reserve.outputs.build_number }}
      HIVECODE_VERSION: ${{ needs.reserve.outputs.version }}
      HIVECODE_COMMIT_SHA: ${{ inputs.source_sha || github.sha }}
      HIVECODE_EMBED_RELEASE_IDENTITY: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      ORCA_REQUIRE_ORCAD_TEMPLATE: '1'
      ORCA_LINUX_ARM64_RELEASE: ${{ matrix.architecture == 'arm64' && '1' || '0' }}
      ORCA_BUILD_IDENTITY: ${{ needs.reserve.outputs.channel == 'stable' && 'stable' || 'rc' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Stage the qualified headless runtime template
        uses: actions/download-artifact@v8
        with:
          name: orcad-template
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: out/orcad-template

      - name: Stage the qualified Windows process-tree addons
        uses: actions/download-artifact@v8
        with:
          name: orcad-windows-process-tree
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: .build/windows-process-tree

      - uses: pnpm/setup@v2
        with:
          install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build application
        env:
          ORCA_BUILD_IDENTITY: ${{ needs.reserve.outputs.channel == 'stable' && 'stable' || 'rc' }}
        run: pnpm build:release

      - name: Gate runtime file-watcher process isolation
        shell: bash
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
        run: |
          set -euo pipefail
          export TMPDIR="$GITHUB_WORKSPACE/logs/release-watcher-gates/${{ matrix.architecture }}/runtime/tmp"
          mkdir -p "$TMPDIR"
          node config/scripts/runtime-file-watcher-fault-harness.mjs 2>&1 | tee "$TMPDIR/../node.log"
          ELECTRON_RUN_AS_NODE=1 pnpm exec electron config/scripts/runtime-file-watcher-fault-harness.mjs 2>&1 | tee "$TMPDIR/../electron.log"

      - name: Package AppImage without external publishing
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.builder_arch }}
        run: |
          set -euo pipefail
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          if [[ "$TARGET_ARCH" == arm64 ]]; then
            ORCA_LINUX_ARM64_RELEASE=1 pnpm exec electron-builder --config config/electron-builder.config.cjs --linux AppImage --arm64 --publish never
          else
            pnpm exec electron-builder --config config/electron-builder.config.cjs --linux AppImage --x64 --publish never
          fi

      - name: Smoke packaged native runtime
        run: node config/scripts/run-linux-packaged-node-pty-floor-smoke.mjs --app-dir ${{ matrix.unpacked_dir }}

      - name: Stage immutable AppImage
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          artifact="$(find dist -maxdepth 1 -type f -iname '*.AppImage' -print -quit)"
          test -n "$artifact"
          mkdir -p upload
          cp "$artifact" "upload/hivecode-linux-${TARGET_ARCH}.AppImage"

      - name: Build headless Runtime deb
        run: pnpm build:linux:runtime-deb

      - name: Smoke packaged headless Runtime
        run: node config/scripts/run-linux-packaged-node-pty-floor-smoke.mjs --app-dir ${{ matrix.unpacked_dir }}

      - name: Stage immutable Runtime deb
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
          RELEASE_VERSION: ${{ needs.reserve.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find dist -maxdepth 1 -type f -name 'hivecode-runtime_*.deb')
          test "${#artifacts[@]}" -eq 1
          expected_deb_arch=amd64
          if [[ "$TARGET_ARCH" == arm64 ]]; then expected_deb_arch=arm64; fi
          test "$(dpkg-deb -f "${artifacts[0]}" Architecture)" = "$expected_deb_arch"
          test "$(dpkg-deb -f "${artifacts[0]}" Package)" = hivecode-runtime
          test "$(dpkg-deb -f "${artifacts[0]}" Version)" = "${RELEASE_VERSION//-/\~}-${HIVECODE_BUILD_NUMBER}"
          cp "${artifacts[0]}" "upload/hivecode-runtime-${TARGET_ARCH}.deb"

      - name: Stage the qualified glibc headless native slot
        uses: actions/download-artifact@v8
        with:
          name: orcad-prebuild-glibc-${{ matrix.runner }}
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: out/orcad-prebuilds

      - name: Require the qualified headless native slot
        run: pnpm build:orcad-prebuilds --require-slots linux-${{ matrix.architecture }}-glibc

      - name: Build self-contained Headless Runtime archive
        run: pnpm build:linux:runtime-archive

      - name: Stage immutable Runtime archive
        run: cp dist/hivecode-runtime-${{ matrix.architecture }}.tar.gz upload/

      - uses: actions/upload-artifact@v7
        with:
          name: hivecode-linux-${{ matrix.architecture }}-${{ inputs.source_sha || github.sha }}
          path: |
            upload/*.AppImage
            upload/*.deb
            upload/*.tar.gz
          if-no-files-found: error
          retention-days: 2

  publish:
    timeout-minutes: 360
    if: ${{ !cancelled() && needs.reserve.result == 'success' && needs.build.result == 'success' && inputs.batch_id != '' }}
    needs: [reserve, build]
    environment: release-production
    permissions:
      id-token: write
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - uses: actions/download-artifact@v8
        with:
          pattern: hivecode-linux-*-${{ inputs.source_sha || github.sha }}
          path: signed-artifacts
          merge-multiple: true

      - name: Configure release upload sender
        shell: bash
        run: bash config/scripts/configure-release-upload-network.sh

      - name: Publish AppImages and Runtime debs to HiveCloud object storage
        env:
          HIVECLOUD_API_URL: ${{ vars.HIVECLOUD_API_URL }}
          HIVECLOUD_RELEASE_SCOPE: ${{ inputs.batch_id != '' && 'artifact' || '' }}
          HIVECLOUD_API_CLIENT_ID: ${{ vars.HIVECLOUD_API_CLIENT_ID }}
          HIVECODE_COMMIT_SHA: ${{ inputs.source_sha || github.sha }}
          HIVECLOUD_RELEASE_ID: ${{ inputs.release_id }}
          HIVECLOUD_RELEASE_BATCH_ID: ${{ inputs.batch_id }}
          HIVECODE_PUBLISH: ${{ inputs.batch_id != '' && 'false' || 'true' }}
          HIVECLOUD_RELEASE_ATTESTATION_KEY: ${{ secrets.HIVECLOUD_RELEASE_ATTESTATION_KEY }}
          HIVECODE_VERSION: ${{ needs.reserve.outputs.version }}
          HIVECODE_BUILD_NUMBER: ${{ needs.reserve.outputs.build_number }}
          HIVECODE_RELEASE_CHANNEL: ${{ needs.reserve.outputs.channel }}
          HIVECODE_DESKTOP_PLATFORM: linux
          HIVECODE_DESKTOP_ARCHITECTURE: x64
          HIVECODE_EXPECTED_ARTIFACTS: '6'
          HIVECODE_EXPECTED_ARTIFACT_ARCHITECTURES: x64,arm64
          HIVECODE_EXPECTED_ARTIFACT_FORMATS: APPIMAGE,DEB,TAR_GZ
          HIVECODE_ARTIFACT_PATHS: x64=signed-artifacts/hivecode-linux-x64.AppImage,arm64=signed-artifacts/hivecode-linux-arm64.AppImage,x64=signed-artifacts/hivecode-runtime-x64.deb,arm64=signed-artifacts/hivecode-runtime-arm64.deb,x64=signed-artifacts/hivecode-runtime-x64.tar.gz,arm64=signed-artifacts/hivecode-runtime-arm64.tar.gz
          HIVECODE_RELEASE_NOTES: ${{ github.ref_name }}
        run: node config/scripts/publish-hivecloud-desktop-release.mjs
