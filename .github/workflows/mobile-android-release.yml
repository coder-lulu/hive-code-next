name: Mobile Android Release

# Why a separate workflow from iOS: iOS releases go through App Store review,
# which can take days. Decoupling the triggers lets an Android release ship
# immediately without waiting on iOS, and vice versa.
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_version:
        required: true
        type: string
      release_channel:
        required: true
        type: string
      release_build_number:
        required: true
        type: string
      release_id:
        required: true
        type: string
      batch_id:
        required: true
        type: string
      runtime_run_id:
        required: true
        type: string
  push:
    tags:
      - 'mobile-android-v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional exact HiveCode marketing version assertion, e.g. 1.5.0-beta.1'
        required: false
        type: string

jobs:
  android-build:
    if: (inputs.batch_id == '' || inputs.source_sha == github.sha) && github.repository == 'coder-lulu/hive-code-next' && (inputs.batch_id != '' || startsWith(github.ref, 'refs/tags/mobile-android-v') || github.event_name == 'workflow_dispatch')
    environment: release-production
    runs-on: ubuntu-latest

    # The Git tag remains in GitHub as source provenance, but release artifacts
    # are owned by HiveCloud and stored through its private OSS service.
    permissions:
      id-token: write
      contents: write

    outputs:
      publish_release: ${{ steps.release.outputs.publish_release }}
      version: ${{ steps.release.outputs.version }}

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version and version code
        id: release
        env:
          MOBILE_ANDROID_RELEASE_VERSION: ${{ inputs.release_version }}
          MOBILE_ANDROID_PUBLISH_RELEASE: 'false'
        run: node scripts/prepare-android-release.mjs

      - name: Validate reserved Android identity
        if: inputs.batch_id != ''
        env:
          RESERVED_BUILD_NUMBER: ${{ inputs.release_build_number }}
          ACTUAL_BUILD_NUMBER: ${{ steps.release.outputs.android_version_code }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          test "$RESERVED_BUILD_NUMBER" = "$ACTUAL_BUILD_NUMBER"
          channel=stable
          if [[ "$RELEASE_VERSION" == *-beta.* ]]; then channel=beta; fi
          test "$RELEASE_CHANNEL" = "$channel"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Configure Android release signing
        env:
          HIVECODE_ANDROID_KEYSTORE_BASE64: ${{ secrets.HIVECODE_ANDROID_KEYSTORE_BASE64 }}
          HIVECODE_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/app/hivecode-release.keystore
          HIVECODE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HIVECODE_ANDROID_KEYSTORE_PASSWORD }}
          HIVECODE_ANDROID_KEY_ALIAS: ${{ secrets.HIVECODE_ANDROID_KEY_ALIAS }}
          HIVECODE_ANDROID_KEY_PASSWORD: ${{ secrets.HIVECODE_ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-release-signing.mjs

      - name: Build Android release APK
        env:
          HIVECODE_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/app/hivecode-release.keystore
          HIVECODE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HIVECODE_ANDROID_KEYSTORE_PASSWORD }}
          HIVECODE_ANDROID_KEY_ALIAS: ${{ secrets.HIVECODE_ANDROID_KEY_ALIAS }}
          HIVECODE_ANDROID_KEY_PASSWORD: ${{ secrets.HIVECODE_ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease

      - name: Verify Android APK signature and certificate
        env:
          HIVECODE_ANDROID_SIGNING_FINGERPRINT: ${{ secrets.HIVECODE_ANDROID_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          expected="$(printf '%s' "$HIVECODE_ANDROID_SIGNING_FINGERPRINT" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          verification="$($apksigner verify --verbose --print-certs "$apk")"
          actual="$(printf '%s\n' "$verification" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$actual" = "$expected"

      - name: Remove Android signing key
        if: always()
        run: rm -f android/app/hivecode-release.keystore

      # Why: an install that fails with a missing certificate or a package-parse error is
      # usually a download that died near the end, and the signature block sits in the last
      # ~100 KB. Publishing the size and digest is what lets a reporter tell a truncated
      # download apart from a bad build without anyone re-deriving them from the asset.
      - name: Checksum the APK
        id: apk
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#apks[@]}" >&2
            exit 1
          fi

          apk="${apks[0]}"
          bytes="$(wc -c < "$apk" | tr -d ' ')"
          sha256="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          # A sibling file in `sha256sum -c` format, so verifying a download is one command
          # and no retyped digest. The asset globs below match *.apk and skip it. The ` *`
          # marker is binary mode: Git Bash's sha256sum reads text mode as a licence to
          # translate line endings while hashing, which would fail on a valid APK.
          printf '%s *%s\n' "$sha256" "$(basename "$apk")" > "$apk.sha256"

          {
            echo "checksum=$apk.sha256"
            echo "bytes=$bytes"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          echo "APK is $bytes bytes, sha256 $sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: hivecode-mobile-apk
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk.sha256

      - name: Publish signed APK to HiveCloud
        if: inputs.batch_id != ''
        env:
          HIVECLOUD_API_URL: ${{ vars.HIVECLOUD_API_URL }}
          HIVECLOUD_RELEASE_SCOPE: ${{ inputs.batch_id != '' && 'artifact' || '' }}
          HIVECLOUD_API_CLIENT_ID: ${{ vars.HIVECLOUD_API_CLIENT_ID }}
          HIVECODE_COMMIT_SHA: ${{ inputs.source_sha || github.sha }}
          HIVECLOUD_RELEASE_ID: ${{ inputs.release_id }}
          HIVECLOUD_RELEASE_BATCH_ID: ${{ inputs.batch_id }}
          HIVECODE_PUBLISH: ${{ inputs.batch_id != '' && 'false' || 'true' }}
          HIVECLOUD_RELEASE_ATTESTATION_KEY: ${{ secrets.HIVECLOUD_RELEASE_ATTESTATION_KEY }}
          HIVECLOUD_APK_PATH: android/app/build/outputs/apk/release/app-release.apk
          HIVECODE_VERSION: ${{ steps.release.outputs.version }}
          HIVECODE_ANDROID_BUILD_NUMBER: ${{ steps.release.outputs.android_version_code }}
          HIVECODE_ANDROID_ARCHITECTURE: universal
          HIVECODE_RELEASE_CHANNEL: ${{ inputs.release_channel || (contains(steps.release.outputs.version, '-') && 'beta' || 'stable') }}
          HIVECODE_ANDROID_SIGNING_FINGERPRINT: ${{ secrets.HIVECODE_ANDROID_SIGNING_FINGERPRINT }}
        run: node scripts/publish-hivecloud-release.mjs
