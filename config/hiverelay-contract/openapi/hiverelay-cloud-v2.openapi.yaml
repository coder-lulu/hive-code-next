openapi: 3.1.0
info:
  title: HiveRelay v2 contract
  version: hiverelay-v2-p0.7
  description: >-
    Authority interface shapes. Every implementation remains disabled until its
    corresponding product and capability gates are enabled.
servers:
  - url: https://cloud.hive.test
    description: HiveCloud authority
x-hiverelay-public-wss:
  - path: /v1/host/control
    role: runtime-host-control
    credential: controlLease
  - path: /v1/host/data/{connId}
    role: runtime-host-data
    credential: connTicket
  - path: /v1/connect/{relayHostId}
    role: client-admission
    credential: clientAdmissionToken
x-hiverelay-cell-private-paths:
  /hive/v1/runtimes/{runtimeRecordId}/relay/control-leases/refresh:
    post:
      operationId: refreshRuntimeRelayControlLeaseV2
      security: []
      description: Runtime-proof-only expiry CAS for the currently acknowledged owner; preserves control generation and never creates an owner.
      parameters:
        - name: runtimeRecordId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/UuidV4'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/control-lease-refresh.schema.json'}
      responses:
        '200':
          description: Current assignment and refreshed or replay-stable control lease
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/SymbolicConflict'}
        '503': {$ref: '#/components/responses/RelayUnavailable'}
  - /internal/status
  - /internal/v1/lifecycle
  - /internal/v1/fences
paths:
  /hive/v1/runtime-heartbeats:
    post:
      operationId: recordRuntimeRelayControlHeartbeatV1
      security: []
      x-hiverelay-capability: runtime-session-control-v1
      x-hiverelay-legacy-response-shape: unchanged-when-capability-absent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '../schemas/runtime-heartbeat-relay-control.schema.json#/$defs/legacyHeartbeatRequest'}
                - {$ref: '../schemas/runtime-heartbeat-relay-control.schema.json#/$defs/relayHeartbeatRequest'}
      responses:
        '200':
          description: Relay control heartbeat response for a capability-declaring Runtime
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '../schemas/runtime-heartbeat-relay-control.schema.json#/$defs/legacyHeartbeatResponse'}
                  - {$ref: '../schemas/runtime-heartbeat-relay-control.schema.json#/$defs/relayHeartbeatResponse'}
        '400': {$ref: '#/components/responses/RuntimeHeartbeatBadRequest'}
        '401': {$ref: '#/components/responses/RuntimeHeartbeatProofRejected'}
        '409': {$ref: '#/components/responses/RuntimeHeartbeatConflict'}
        '410': {$ref: '#/components/responses/RuntimeHeartbeatGone'}
        '422': {$ref: '#/components/responses/RuntimeHeartbeatUnprocessable'}
        '426': {$ref: '#/components/responses/RuntimeHeartbeatUpgradeRequired'}
        '503': {$ref: '#/components/responses/RuntimeHeartbeatUnavailable'}
  /hive/v1/runtime-relay-hosts:
    post:
      operationId: registerRelayHostV2
      security: []
      x-hiverelay-runtime-proof-carrier: json-body.runtimeProof
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HostRegistrationRequest'}
      responses:
        '200':
          description: Current Host binding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HostRegistrationResponse'}
        '409': {$ref: '#/components/responses/SymbolicConflict'}
  /hive/v1/runtimes/{runtimeRecordId}/relay/authorizations:
    post:
      operationId: authorizeRuntimeRelayV2
      security: []
      x-hiverelay-runtime-proof-carrier: json-body.runtimeProof
      parameters:
        - {$ref: '#/components/parameters/RuntimeRecordId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RelayAuthorizationRequest'}
      responses:
        '200':
          description: Short-lived Director credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RelayAuthorizationResponse'}
        '409': {$ref: '#/components/responses/SymbolicConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/assign:
    post:
      operationId: assignRuntimeToCellV2
      servers:
        - url: https://relay-director.hive.test
      security: [{relayToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignmentRequest'}
      responses:
        '200':
          description: Exact Cell assignment and control lease
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentResponse'}
        '409': {$ref: '#/components/responses/SymbolicConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /hive/v1/runtimes/{runtimeRecordId}/connection-intents:
    post:
      operationId: createRuntimeConnectionIntentV2
      security: [{hiveSession: []}]
      parameters:
        - {$ref: '#/components/parameters/RuntimeRecordId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionIntentRequest'}
      responses:
        '200':
          description: V2 outer admission and E2EE inner ticket material
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectionIntentResponse'}
        '409': {$ref: '#/components/responses/SymbolicConflict'}
        '426': {$ref: '#/components/responses/UpgradeRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /hive/v1/runtime-connection-tickets/{ticketId}/consume:
    post:
      operationId: consumeRuntimeConnectionTicketV2
      security: []
      x-hiverelay-runtime-proof-carrier: json-body.runtimeProof
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/UuidV4'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketConsumeRequest'}
      responses:
        '200':
          description: Stable replayable consume result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketConsumeResponse'}
        '409': {$ref: '#/components/responses/SymbolicConflict'}
  /hive/v1/runtimes/{runtimeRecordId}/session-transitions:
    post:
      operationId: applyManagedSessionTransitionsV2
      security: []
      x-hiverelay-runtime-proof-carrier: json-body.runtimeProof
      parameters:
        - {$ref: '#/components/parameters/RuntimeRecordId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/session-transition.schema.json#/$defs/batchRequest'}
      responses:
        '200':
          description: Ordered stored/rejected adjudications and covering contiguous ACK
          content:
            application/json:
              schema: {$ref: '../schemas/session-transition.schema.json#/$defs/batchResponse'}
        '409': {$ref: '#/components/responses/SymbolicConflict'}
  /hive/v1/runtime-sessions/{managedRuntimeSessionId}/revoke:
    post:
      operationId: revokeManagedRuntimeSessionV2
      security: [{hiveSession: []}]
      description: >-
        Revoke only a session owned by the authenticated account, device and Cloud
        session. The body operationId is the only idempotency key; an exact replay
        returns its stored result. Any Idempotency-Key header is rejected, including
        one equal to operationId. Cookie, query and Origin carriers are rejected.
        The path ID must be a canonical lowercase UUID v4 without path parameters.
        The endpoint requires hive.relay.enabled and hive.session-credentials.enabled.
        This v2 branch remains available for existing sessions when new admission
        is disabled; the legacy v1 delegate keeps its original behavior.
      parameters:
        - name: managedRuntimeSessionId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/UuidV4'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/session-revoke.schema.json#/$defs/request'}
      responses:
        '202':
          description: Stored authoritative revocation result, including an exact replay
          headers:
            Cache-Control: {schema: {const: no-store}}
          content:
            application/json:
              schema: {$ref: '../schemas/session-revoke.schema.json#/$defs/response'}
        '400': {$ref: '#/components/responses/SessionRevokeError'}
        '401': {$ref: '#/components/responses/SessionRevokeError'}
        '404': {$ref: '#/components/responses/SessionRevokeError'}
        '409': {$ref: '#/components/responses/SessionRevokeError'}
        '503': {$ref: '#/components/responses/SessionRevokeError'}
  /hive/v1/relay-cells/{cellId}/lifecycle:
    get:
      operationId: readCloudRelayCellLifecycleV1
      security: [{relayFleetOperatorMtls: []}]
      x-hiverelay-required-scope: relay:fleet:lifecycle
      description: Read the current CAS versions before a new lifecycle operation. No request body, query, Origin, Authorization, or Cookie is accepted.
      parameters:
        - name: cellId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/OpaqueId'}
      responses:
        '200':
          description: Low-sensitivity authoritative lifecycle snapshot without credentials or private routing data
          content:
            application/json:
              schema: {$ref: '../schemas/lifecycle-snapshot.schema.json'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/OperatorCredentialRejected'}
        '403': {$ref: '#/components/responses/OperatorScopeRejected'}
        '409': {$ref: '#/components/responses/SymbolicConflict'}
        '503': {$ref: '#/components/responses/RelayUnavailable'}
    post:
      operationId: applyCloudRelayCellLifecycleV1
      security: [{relayFleetOperatorMtls: []}]
      x-hiverelay-required-scope: relay:fleet:lifecycle
      parameters:
        - name: cellId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/OpaqueId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/lifecycle-operator.schema.json#/$defs/request'}
      responses:
        '200':
          description: Authoritative idempotent lifecycle result with optional private delivery result
          content:
            application/json:
              schema: {$ref: '../schemas/lifecycle-operator.schema.json#/$defs/response'}
        '401': {$ref: '#/components/responses/OperatorCredentialRejected'}
        '403': {$ref: '#/components/responses/OperatorScopeRejected'}
        '409': {$ref: '#/components/responses/SymbolicConflict'}
        '503': {$ref: '#/components/responses/LifecycleDeliveryUnavailable'}
  /internal/status:
    get:
      operationId: readCellStatusV2
      servers: [{url: 'https://cell-01.private.hive.test:8443'}]
      security: [{cellOpsToken: []}]
      x-hiverelay-cell-ops-token-carrier: private-https-authorization-header
      x-hiverelay-cell-ops-replay-consumption: after-authentication-before-handler
      parameters:
        - name: nonce
          in: header
          required: true
          description: Must equal the authenticated cellOpsToken nonce and returned status nonce.
          schema: {$ref: '#/components/schemas/Base64Url16'}
      responses:
        '200':
          description: Non-sensitive Cell readiness report
          content:
            application/json:
              schema: {$ref: '../schemas/private-ops.schema.json#/$defs/statusResponse'}
  /internal/v1/lifecycle:
    post:
      operationId: applyCellLifecycleCommandV2
      servers: [{url: 'https://cell-01.private.hive.test:8443'}]
      security: [{cellOpsToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/private-ops.schema.json#/$defs/lifecycleCommand'}
      responses:
        '200':
          description: Idempotent command result
          content:
            application/json:
              schema: {$ref: '../schemas/private-ops.schema.json#/$defs/commandResult'}
        '409': {$ref: '#/components/responses/SymbolicConflict'}
  /internal/v1/fences:
    post:
      operationId: applyCellFenceCommandV2
      servers: [{url: 'https://cell-01.private.hive.test:8443'}]
      security: [{cellOpsToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '../schemas/private-ops.schema.json#/$defs/assignmentFence'}
                - {$ref: '../schemas/private-ops.schema.json#/$defs/incarnationFence'}
      responses:
        '200':
          description: Idempotent command result
          content:
            application/json:
              schema: {$ref: '../schemas/private-ops.schema.json#/$defs/commandResult'}
        '409': {$ref: '#/components/responses/SymbolicConflict'}
components:
  securitySchemes:
    hiveSession:
      type: http
      scheme: bearer
    relayToken:
      type: http
      scheme: bearer
      bearerFormat: compact JWS relay-assignment+jwt
    cellOpsToken:
      type: http
      scheme: bearer
      bearerFormat: compact JWS relay-cell-ops+jwt
    relayFleetOperatorMtls:
      type: mutualTLS
      description: Dedicated fleet-gate client certificate mapped to relay:fleet:lifecycle; ordinary admin, Runtime and Client credentials are rejected.
  parameters:
    RuntimeRecordId:
      name: runtimeRecordId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UuidV4'}
  responses:
    RuntimeHeartbeatBadRequest:
      description: Malformed or structurally invalid Runtime heartbeat
      content:
        application/problem+json:
          schema: {$ref: '../schemas/runtime-heartbeat-errors.schema.json#/$defs/legacyBadRequest'}
        application/json:
          schema: {$ref: '../schemas/runtime-heartbeat-errors.schema.json#/$defs/relayBadRequest'}
    RuntimeHeartbeatProofRejected:
      description: Runtime heartbeat proof or credential carrier rejected
      content:
        application/problem+json:
          schema: {$ref: '../schemas/runtime-heartbeat-errors.schema.json#/$defs/legacyProofRejected'}
        application/json:
          schema: {$ref: '../schemas/runtime-heartbeat-errors.schema.json#/$defs/relayProofRejected'}
    RuntimeHeartbeatConflict:
      description: Runtime heartbeat, command acknowledgement, or sequence replay conflict
      content:
        application/problem+json:
          schema: {$ref: '../schemas/runtime-heartbeat-errors.schema.json#/$defs/legacyConflict'}
        application/json:
          schema: {$ref: '../schemas/runtime-heartbeat-errors.schema.json#/$defs/relayConflict'}
    RuntimeHeartbeatGone:
      description: Runtime, lease, credential, or Relay assignment binding is stale
      content:
        application/problem+json:
          schema: {$ref: '../schemas/runtime-heartbeat-errors.schema.json#/$defs/legacyGone'}
        application/json:
          schema: {$ref: '../schemas/runtime-heartbeat-errors.schema.json#/$defs/relayGone'}
    RuntimeHeartbeatUnprocessable:
      description: Structurally valid heartbeat failed semantic validation
      content:
        application/problem+json:
          schema: {$ref: '../schemas/runtime-heartbeat-errors.schema.json#/$defs/legacyUnprocessable'}
        application/json:
          schema: {$ref: '../schemas/runtime-heartbeat-errors.schema.json#/$defs/relayUnprocessable'}
    RuntimeHeartbeatUpgradeRequired:
      description: Runtime requested Relay control while its server-side capability gate is disabled
      content:
        application/problem+json:
          schema: {$ref: '../schemas/runtime-heartbeat-errors.schema.json#/$defs/legacyUpgradeRequired'}
        application/json:
          schema: {$ref: '../schemas/runtime-heartbeat-errors.schema.json#/$defs/relayUpgradeRequired'}
    RuntimeHeartbeatUnavailable:
      description: Runtime heartbeat authority is transiently unavailable
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1, maximum: 30}
      content:
        application/problem+json:
          schema: {$ref: '../schemas/runtime-heartbeat-errors.schema.json#/$defs/legacyUnavailable'}
        application/json:
          schema: {$ref: '../schemas/runtime-heartbeat-errors.schema.json#/$defs/relayUnavailable'}
    SessionRevokeError:
      description: Symbolic owner, input, state, replay, or availability rejection without authority details
      content:
        application/json:
          schema: {$ref: '../schemas/session-revoke.schema.json#/$defs/error'}
    InvalidRequest:
      description: Malformed request or unsupported carrier
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RelayUnavailable:
      description: Authoritative Relay storage is temporarily unavailable
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1, maximum: 30}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    SymbolicConflict:
      description: Binding, state, idempotency, or replay conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    UpgradeRequired:
      description: V2 is not supported by the selected component set
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    RateLimited:
      description: Frozen quota exceeded
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1, maximum: 30}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    OperatorCredentialRejected:
      description: Dedicated fleet lifecycle mTLS credential is missing or invalid
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    OperatorScopeRejected:
      description: Authenticated operator credential lacks relay:fleet:lifecycle
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    LifecycleDeliveryUnavailable:
      description: Authority may already be committed; retry the identical request with the same operationId to safely repeat private delivery
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1, maximum: 30}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    UuidV4:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Generation:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    EpochMs:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    Base64Url16:
      type: string
      pattern: '^[A-Za-z0-9_-]{22}$'
    Base64Url32:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
    RuntimeTuple:
      type: object
      additionalProperties: false
      required: [runtimeId, runtimeBootId, authorityGeneration, fencingEpoch, leaseEpoch]
      properties:
        runtimeId: {$ref: '#/components/schemas/OpaqueId'}
        runtimeBootId: {$ref: '#/components/schemas/UuidV4'}
        authorityGeneration: {$ref: '#/components/schemas/Generation'}
        fencingEpoch: {$ref: '#/components/schemas/Generation'}
        leaseEpoch: {$ref: '#/components/schemas/Generation'}
    HostRegistrationRequest:
      type: object
      additionalProperties: false
      required: [protocolVersion, runtimeProof, runtimeId, runtimeBootId, authorityGeneration, fencingEpoch, leaseEpoch, hostPublicKeyB64, requestedRelayHostId, expectedBindingVersion]
      properties:
        protocolVersion: {const: 2}
        runtimeProof: {$ref: '../schemas/runtime-proof.schema.json'}
        runtimeId: {$ref: '#/components/schemas/OpaqueId'}
        runtimeBootId: {$ref: '#/components/schemas/UuidV4'}
        authorityGeneration: {$ref: '#/components/schemas/Generation'}
        fencingEpoch: {$ref: '#/components/schemas/Generation'}
        leaseEpoch: {$ref: '#/components/schemas/Generation'}
        hostPublicKeyB64: {$ref: '#/components/schemas/Base64Url32'}
        requestedRelayHostId: {type: string, pattern: '^[A-Za-z0-9_-]{16}$'}
        expectedBindingVersion: {$ref: '#/components/schemas/Generation'}
    HostRegistrationResponse:
      type: object
      additionalProperties: false
      required: [protocolVersion, relayHostId, hostBindingVersion]
      properties:
        protocolVersion: {const: 2}
        relayHostId: {type: string, pattern: '^[A-Za-z0-9_-]{16}$'}
        hostBindingVersion: {$ref: '#/components/schemas/Generation'}
    RelayAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [protocolVersion, runtimeProof, capabilities]
      properties:
        protocolVersion: {const: 2}
        runtimeProof: {$ref: '../schemas/runtime-proof.schema.json'}
        capabilities:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 8
          items: {enum: [ticket-connect-v2]}
    RelayAuthorizationResponse:
      type: object
      additionalProperties: false
      required: [protocolVersion, relayToken, expiresAt]
      properties:
        protocolVersion: {const: 2}
        relayToken: {type: string, maxLength: 8192}
        expiresAt: {$ref: '#/components/schemas/EpochMs'}
    AssignmentRequest:
      type: object
      additionalProperties: false
      required: [protocolVersion, hostPublicKeyB64]
      properties:
        protocolVersion: {const: 2}
        hostPublicKeyB64: {$ref: '#/components/schemas/Base64Url32'}
        requestedRegion: {$ref: '#/components/schemas/OpaqueId'}
    AssignmentResponse:
      type: object
      additionalProperties: false
      required: [protocolVersion, cellUrl, cellId, cellIncarnationId, assignmentId, assignmentEpoch, relayHostId, controlLease, controlLeaseExpiresAt]
      properties:
        protocolVersion: {const: 2}
        cellUrl: {type: string, pattern: '^https://[a-z0-9.-]+(?::[0-9]{1,5})?$'}
        cellId: {$ref: '#/components/schemas/OpaqueId'}
        cellIncarnationId: {$ref: '#/components/schemas/UuidV4'}
        assignmentId: {$ref: '#/components/schemas/UuidV4'}
        assignmentEpoch: {$ref: '#/components/schemas/Generation'}
        relayHostId: {type: string, pattern: '^[A-Za-z0-9_-]{16}$'}
        controlLease: {type: string, maxLength: 8192}
        controlLeaseExpiresAt: {$ref: '#/components/schemas/EpochMs'}
    ConnectionIntentRequest:
      type: object
      additionalProperties: false
      required: [protocolVersion, idempotencyKey, expectedResourceVersion, clientKind, clientPublicKeyB64, ticketSecretSha256]
      properties:
        protocolVersion: {const: 2}
        idempotencyKey: {$ref: '#/components/schemas/UuidV4'}
        expectedResourceVersion: {type: integer, minimum: 1, maximum: 9007199254740991}
        clientKind: {enum: [DESKTOP, MOBILE, WEB]}
        clientPublicKeyB64: {$ref: '#/components/schemas/Base64Url32'}
        ticketSecretSha256: {$ref: '#/components/schemas/Base64Url32'}
    ConnectionIntentResponse:
      type: object
      additionalProperties: false
      required: [protocolVersion, intentId, ticketId, expiresAt, cellUrl, cellId, cellIncarnationId, assignmentId, assignmentEpoch, relayHostId, clientAdmissionToken, runtimePublicKeyB64, e2eeFraming]
      properties:
        protocolVersion: {const: 2}
        intentId: {$ref: '#/components/schemas/UuidV4'}
        ticketId: {$ref: '#/components/schemas/UuidV4'}
        expiresAt: {$ref: '#/components/schemas/EpochMs'}
        cellUrl: {type: string, pattern: '^https://[a-z0-9.-]+(?::[0-9]{1,5})?$'}
        cellId: {$ref: '#/components/schemas/OpaqueId'}
        cellIncarnationId: {$ref: '#/components/schemas/UuidV4'}
        assignmentId: {$ref: '#/components/schemas/UuidV4'}
        assignmentEpoch: {$ref: '#/components/schemas/Generation'}
        relayHostId: {type: string, pattern: '^[A-Za-z0-9_-]{16}$'}
        clientAdmissionToken: {type: string, maxLength: 8192}
        runtimePublicKeyB64:
          allOf: [{$ref: '#/components/schemas/Base64Url32'}]
          description: X25519 public key of the current Host Binding used for Client-Runtime E2EE; never the Runtime Ed25519 proof identity key.
        e2eeFraming: {const: hive-relay-e2ee/v2}
    TicketConsumeRequest:
      type: object
      additionalProperties: false
      required: [protocolVersion, runtimeProof, consumeAttemptId, ticketSecret, intentId, runtimeId, runtimeBootId, authorityGeneration, fencingEpoch, leaseEpoch, assignmentId, assignmentEpoch, controlGeneration, cellId, cellIncarnationId, connId, clientKeyHash, e2eeTranscriptHash, sessionBindingHash]
      properties:
        protocolVersion: {const: 'account-runtime-ticket-consume/v2'}
        runtimeProof: {$ref: '../schemas/runtime-proof.schema.json'}
        consumeAttemptId: {$ref: '#/components/schemas/UuidV4'}
        ticketSecret: {$ref: '#/components/schemas/Base64Url32'}
        intentId: {$ref: '#/components/schemas/UuidV4'}
        runtimeId: {$ref: '#/components/schemas/OpaqueId'}
        runtimeBootId: {$ref: '#/components/schemas/UuidV4'}
        authorityGeneration: {$ref: '#/components/schemas/Generation'}
        fencingEpoch: {$ref: '#/components/schemas/Generation'}
        leaseEpoch: {$ref: '#/components/schemas/Generation'}
        assignmentId: {$ref: '#/components/schemas/UuidV4'}
        assignmentEpoch: {$ref: '#/components/schemas/Generation'}
        controlGeneration: {$ref: '#/components/schemas/Generation'}
        cellId: {$ref: '#/components/schemas/OpaqueId'}
        cellIncarnationId: {$ref: '#/components/schemas/UuidV4'}
        connId: {$ref: '#/components/schemas/OpaqueId'}
        clientKeyHash: {$ref: '#/components/schemas/Base64Url32'}
