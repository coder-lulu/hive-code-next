model_provider = "hive-loopback"
model = "gpt-6.1-sol"
model_reasoning_effort = "low"
model_catalog_json = "/etc/codex/hive-models.json"
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "disabled"
allow_login_shell = false
mcp_servers = {}

[agents]
enabled = false

[orchestrator.mcp]
enabled = false

[cloud.skills]
enabled = false

[tools.experimental_request_user_input]
enabled = false

[tools.update_plan]
enabled = false

[shell_environment_policy]
inherit = "none"
set = { PATH = "/usr/local/bin:/usr/bin:/bin", HOME = "/home/hive", CODEX_HOME = "/home/hive/.codex" }

[features]
shell_tool = true
unified_exec = true
unified_exec_tty = false
shell_zsh_fork = false
shell_snapshot = false
hooks = false
apps = false
plugins = false
image_generation = false
view_image = false
enable_mcp_apps = false
tool_suggest = false
recommended_plugins = false
remote_plugin = false
plugin_sharing = false
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
computer_use = false
multi_agent = false
multi_agent_v2 = false
current_time_reminder = false
sleep_tool = false
goals = false
token_budget = false
context_management = false
deferred_executor = false
send_message_to_user_async = false
memories = false
skip_host_skill_discovery = true
skill_search = false
skill_mcp_dependency_install = false
request_permissions_tool = false
exec_permission_approvals = false
realtime_conversation = false

[features.code_mode_host]
enabled = true
disable_in_process_fallback = true

[features.tool_registry]
error_on_tool_collisions = true
turn_metadata_includes_tool_info = false

[model_providers.hive-loopback]
name = "Hive loopback broker"
base_url = "http://127.0.0.1:41000/v1"
wire_api = "responses"
requires_openai_auth = false
supports_websockets = false
supports_standalone_web_search = false
include_internal_metadata = false
request_max_retries = 0
stream_max_retries = 0
stream_idle_timeout_ms = 30000
